name: CodSpeed Benchmarks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build CodSpeed JMH fork
        run: cd third-party/codspeed-jvm/jmh-fork && mvn clean install -DskipTests -q

      - name: Build benchmarks
        run: mvn clean verify -q -f benchmarks/pom.xml

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: java -jar benchmarks/target/benchmarks.jar
